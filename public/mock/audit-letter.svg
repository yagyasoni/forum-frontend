<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#e9ebef"/>
  <rect x="260" y="30" width="680" height="640" fill="#fff" stroke="#d1d5db"/>
  <rect x="300" y="70" width="120" height="14" rx="3" fill="#111827"/>
  <text x="300" y="128" fill="#111827" font-size="20" font-weight="700">NOTICE OF DESK AUDIT</text>
  <text x="300" y="158" fill="#6b7280" font-size="15">Audit ID 23-88412 · Claims period 01/01/2023 – 12/31/2023</text>
  <g fill="#4b5563" font-size="15">
    <text x="300" y="210">Dear Pharmacy,</text>
    <text x="300" y="245">You are requested to submit the following documentation</text>
    <text x="300" y="268">for the 40 claims listed on the attached schedule within</text>
    <text x="300" y="291">30 days of the date of this letter:</text>
    <text x="320" y="335">1. Purchase invoices for each NDC dispensed</text>
    <text x="320" y="360">2. Original prescription or e-script record</text>
    <text x="320" y="385">3. Signature log or proof of delivery</text>
    <text x="320" y="410">4. Pharmacist license and DEA registration</text>
    <text x="300" y="455">Failure to respond may result in recoupment of the full</text>
    <text x="300" y="478">reimbursed amount for the claims under review.</text>
  </g>
  <rect x="300" y="520" width="160" height="10" rx="2" fill="#9ca3af"/>
  <rect x="300" y="545" width="240" height="10" rx="2" fill="#d1d5db"/>
</svg>
